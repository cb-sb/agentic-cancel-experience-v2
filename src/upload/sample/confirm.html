<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Confirm cancel</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <!-- Chargebee Growth slot contract v1.0.0. Restyle chrome. Do not remove data-cb-* marks. Do not encode targeting, holdout, or publish. -->
    <main class="page" data-cb-step="confirm" data-cb-kind="confirmation">
      <div class="eyebrow">Last step</div>
      <h1>Cancel <span data-cb-field="plan_name">Pro annual</span>?</h1>
      <p class="lede">
        Access runs through
        <span data-cb-field="next_renewal">12 Oct</span>.
        You can come back later — this just stops renewal.
      </p>
      <div class="cta-row">
        <button type="button" class="btn btn-ghost" data-cb-action="keep">Keep my plan</button>
        <button type="button" class="btn btn-danger" data-cb-action="cancel">Cancel plan</button>
      </div>
    </main>
  </body>
</html>
