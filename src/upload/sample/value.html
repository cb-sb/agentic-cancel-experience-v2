<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Before you go</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <main class="page" data-cb-step="value" data-cb-kind="loss_aversion">
      <div class="eyebrow">Before you go</div>
      <h1>You’ve built a lot on this plan.</h1>
      <p class="lede">
        Cancelling ends access to
        <span data-cb-field="plan_name">Pro annual</span>
        at the next renewal.
      </p>
      <div class="stats" data-cb-slot="la_stats">
        <div class="stat">
          <b data-cb-field="credits_remaining">1,240</b>
          <span>credits remaining</span>
        </div>
        <div class="stat">
          <b data-cb-field="days_on_plan">412</b>
          <span>days on the plan</span>
        </div>
        <div class="stat">
          <b data-cb-field="usage_hours">92</b>
          <span>hours saved this year</span>
        </div>
      </div>
      <div class="cta-row">
        <a class="btn btn-primary" href="survey.html" data-cb-action="continue" data-cb-next="survey.html">Continue</a>
        <button type="button" class="btn btn-ghost" data-cb-action="keep">Keep my plan</button>
      </div>
    </main>
  </body>
</html>
