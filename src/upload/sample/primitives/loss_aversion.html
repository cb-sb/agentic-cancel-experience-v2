<!doctype html>
<html lang="en" data-cb-contract="1.0.0" data-cb-kit="catalog">
  <head>
    <meta charset="utf-8" />
    <title>Loss aversion</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <!-- Chargebee Growth slot contract v1.0.0. Catalog primitive — not an experience. Restyle chrome. Do not change data-cb-* names or values. Strip data-cb-kit when composing an experience. -->
    <main class="page" data-cb-step="value" data-cb-kind="loss_aversion">
      <div class="eyebrow">Loss aversion</div>
      <h1>You’ve built a lot on this plan.</h1>
      <p class="lede">
        Cancelling ends access to
        <span data-cb-field="plan_name">[plan name]</span>
        at the next renewal.
      </p>
      <div class="stats slot" data-cb-slot="la_stats">
        <p class="slot-label">Growth slot — subscriber fields</p>
        <div class="stat">
          <b data-cb-field="days_on_plan">[n]</b>
          <span>days on the plan</span>
        </div>
        <div class="stat">
          <b data-cb-field="member_since">[date]</b>
          <span>member since</span>
        </div>
        <div class="stat">
          <b data-cb-field="next_renewal">[date]</b>
          <span>next renewal</span>
        </div>
      </div>
      <div class="cta-row">
        <button type="button" class="btn btn-primary" data-cb-action="continue">Continue</button>
        <button type="button" class="btn btn-ghost" data-cb-action="keep">Keep my plan</button>
      </div>
    </main>
  </body>
</html>
