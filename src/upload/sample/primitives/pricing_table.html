<!doctype html>
<html lang="en" data-cb-contract="1.0.0" data-cb-kit="catalog">
  <head>
    <meta charset="utf-8" />
    <title>Pricing table</title>
    <link rel="stylesheet" href="../shared.css" />
  </head>
  <body>
    <!-- Chargebee Growth slot contract v1.0.0. Catalog primitive — not an experience. Restyle chrome. Do not change data-cb-* names or values. Strip data-cb-kit when composing an experience. -->
    <main class="page page-wide" data-cb-step="pricing" data-cb-kind="pricing_table">
      <div class="eyebrow">Pricing table</div>
      <h1>Choose a plan</h1>
      <p class="lede">Merchant chrome. Replace placeholder plans. Growth does not bind this grid from the offer catalog.</p>
      <div class="plans">
        <article class="plan">
          <div class="eyebrow">[plan]</div>
          <h2>Starter</h2>
          <p class="lede">Placeholder card.</p>
          <button type="button" class="btn btn-ghost" data-cb-action="continue">Continue</button>
        </article>
        <article class="plan plan-featured">
          <div class="eyebrow">[plan]</div>
          <h2>Growth</h2>
          <p class="lede">Placeholder card.</p>
          <button type="button" class="btn btn-primary" data-cb-action="continue">Continue</button>
        </article>
        <article class="plan">
          <div class="eyebrow">[plan]</div>
          <h2>Scale</h2>
          <p class="lede">Placeholder card.</p>
          <button type="button" class="btn btn-ghost" data-cb-action="continue">Continue</button>
        </article>
      </div>
    </main>
  </body>
</html>
